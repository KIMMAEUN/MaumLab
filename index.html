<title>마음톡 연습실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 사탕 상자 같은 한 화면 앱. 파스텔 바탕에 동글동글한 카드, 탭마다 다른 사탕 색. 말 만들기는 AAC 피츠제럴드 색 체계 유지 */
:root{
  --bg:#fff5f0; --surface:#ffffff; --surface-2:#fdf0f5; --ink:#3b2d4d; --muted:#7a6a8c; --line:#f2dde8;
  --accent:#e0508a; --accent-ink:#ffffff; --accent-soft:#ffe1ec; --sun:#ffcf4d; --mint:#7fd6bb; --sky:#8ec5ff; --lilac:#c6a8ff; --peach:#ffb48a;
  --ok:#23885c; --ok-bg:#e2f6ec; --warn:#c2621c; --warn-bg:#fff0e0;
  --dot1:#ffd9e6; --dot2:#d9f3ea; --dot3:#e6ddff; --shadow:59,45,77;
  --e-joy:#ffcf4d; --e-calm:#7fd6a0; --e-worry:#b9a0f2; --e-sad:#7fb2ee; --e-angry:#f47c6a;
  --fk-people:#fde68f; --fk-verb:#bfe8b5; --fk-desc:#bfdcfa; --fk-social:#fbcde0; --fk-noun:#fdd6ad; --fk-ink:#2b2236;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211a2c; --surface:#2c2340; --surface-2:#382d52; --ink:#f8effe; --muted:#c3b4d8; --line:#4a3d66;
  --accent:#ff8fb8; --accent-ink:#2b0f1e; --accent-soft:#4a2a44; --ok:#7fe0b0; --ok-bg:#1f3b31; --warn:#ffb072; --warn-bg:#43301f;
  --dot1:#3a2a44; --dot2:#24363a; --dot3:#2f2a4a; --shadow:0,0,0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211a2c; --surface:#2c2340; --surface-2:#382d52; --ink:#f8effe; --muted:#c3b4d8; --line:#4a3d66;
  --accent:#ff8fb8; --accent-ink:#2b0f1e; --accent-soft:#4a2a44; --ok:#7fe0b0; --ok-bg:#1f3b31; --warn:#ffb072; --warn-bg:#43301f;
  --dot1:#3a2a44; --dot2:#24363a; --dot3:#2f2a4a; --shadow:0,0,0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:30px}h2{font-size:26px}h3{font-size:21px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand small{display:block;font-size:13px;color:var(--muted);font-family:var(--body)}
.coins{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px}
.coin{width:30px;height:30px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-family:var(--display);color:#3b2c00;font-size:15px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.goal{width:120px;height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.goal i{display:block;height:100%;background:var(--sun);transition:width .4s}
.coins span{font-size:14px;color:var(--muted);white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-block:18px}
.tab{min-height:64px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-size:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:520px){.tab{font-size:15px}.goal{width:70px}h1{font-size:25px}}
.panel{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.lead{color:var(--muted);font-size:16px}
/* 감정 얼굴 */
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.face-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:var(--r);border:3px solid transparent;background:var(--surface-2);min-height:120px}
.face-btn svg{width:64px;height:64px;max-width:100%}
.face-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.face-btn b{font-weight:500;font-size:16px}
@media (max-width:520px){.faces{grid-template-columns:repeat(3,1fr)}}
/* 온도계 */
.thermo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.thermo button{min-height:58px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--display);font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.thermo button small{font-family:var(--body);font-size:12px;color:var(--muted)}
.thermo button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.thermo button[aria-pressed="true"] small{color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface-2);font-size:17px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn{min-height:56px;padding:10px 22px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:20px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:#3b2c00}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.day{background:var(--surface-2);border-radius:12px;padding:10px 6px;text-align:center;font-size:14px;color:var(--muted)}
.day svg{width:40px;height:40px;display:block;margin:4px auto}
.day b{display:block;color:var(--ink);font-weight:500}
.tag{display:inline-block;font-size:12px;letter-spacing:.04em;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
/* 상황 목록 */
.levels{display:flex;gap:8px;flex-wrap:wrap}
.scen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scen{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;min-height:150px;align-content:start}
.scen:hover{border-color:var(--accent)}
.scen .meta{display:flex;gap:6px;flex-wrap:wrap}
.scen h3{font-size:20px}
.scen p{font-size:15px;color:var(--muted)}
.done-mark{color:var(--ok);font-size:14px;font-weight:500}
.lv{font-size:12px;padding:2px 8px;border-radius:6px;font-weight:500}
.lv1{background:var(--ok-bg);color:var(--ok)}.lv2{background:var(--fk-desc);color:var(--fk-ink)}.lv3{background:var(--warn-bg);color:var(--warn)}
/* 시나리오 플레이어 */
.steps{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
.steps span{padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.steps span.on{background:var(--accent);color:var(--accent-ink)}
.comic{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.comic{grid-template-columns:1fr}}
.frame{border:2px solid var(--ink);border-radius:10px;padding:14px;background:var(--surface);display:grid;gap:10px;align-content:start;position:relative;min-width:0}
.frame .n{position:absolute;top:-12px;left:10px;background:var(--ink);color:var(--bg);font-family:var(--display);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.frame .pic{height:128px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center}
.frame .pic svg{height:116px;width:auto;max-width:100%}
.frame p{font-size:18px}
.speak{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--accent);font-weight:500;min-height:40px}
.speak svg{width:20px;height:20px}
.q{font-family:var(--display);font-size:24px}
.opts{display:grid;gap:10px}
.opt{text-align:left;min-height:64px;padding:14px 18px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);font-size:19px;display:flex;align-items:center;gap:12px}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display)}
.opt.tried{opacity:.5;border-style:dashed}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.fb{border-radius:var(--r);padding:16px 18px;display:grid;gap:6px}
.fb.ok{background:var(--ok-bg);color:var(--ink);border:2px solid var(--ok)}
.fb.retry{background:var(--warn-bg);border:2px solid var(--warn)}
.fb b{font-family:var(--display);font-weight:400;font-size:21px}
.hint{background:var(--surface-2);border-radius:var(--r);padding:14px 18px;border:2px dashed var(--line)}
.model{font-family:var(--display);font-size:28px;line-height:1.3;padding:18px;border-radius:var(--r);background:var(--surface-2);text-align:center}
.prompt-lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prompt-lv button{min-height:64px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:16px;padding:6px;line-height:1.3}
.prompt-lv button b{display:block;font-family:var(--display);font-weight:400;font-size:19px}
@media (max-width:520px){.prompt-lv{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:17px;z-index:20;max-width:calc(100% - 32px);text-align:center}
/* AAC */
.strip{min-height:84px;border:3px solid var(--ink);border-radius:var(--r);background:var(--surface);display:flex;flex-wrap:wrap;gap:8px;padding:10px;align-items:center}
.strip:empty::before{content:"아래 낱말을 눌러 문장을 만들어요";color:var(--muted);font-size:16px}
.strip .w{padding:8px 14px;border-radius:10px;font-size:20px;color:var(--fk-ink);font-weight:500}
.aac-cat{display:grid;gap:8px}
.aac-cat h3{font-size:17px;font-family:var(--body);font-weight:500;color:var(--muted);display:flex;align-items:center;gap:8px}
.aac-cat h3 i{width:14px;height:14px;border-radius:4px;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{min-height:70px;border-radius:12px;color:var(--fk-ink);font-size:19px;font-weight:500;padding:8px;border:2px solid rgba(0,0,0,.08);box-shadow:0 3px 0 rgba(0,0,0,.1)}
.tile:active{transform:translateY(2px);box-shadow:none}
.c-people{background:var(--fk-people)}.c-verb{background:var(--fk-verb)}.c-desc{background:var(--fk-desc)}.c-social{background:var(--fk-social)}.c-noun{background:var(--fk-noun)}
/* 교사용 */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:16px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.03em}
td.num{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--surface-2);width:90px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-ind{background:var(--ok-bg);color:var(--ok)}.p-part{background:var(--fk-desc);color:var(--fk-ink)}.p-full{background:var(--warn-bg);color:var(--warn)}.p-none{background:var(--surface-2);color:var(--muted)}
.log{display:grid;gap:6px;font-size:15px}
.log div{display:flex;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:86px}
.notice{font-size:14px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 12px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.stat b{font-family:var(--display);font-size:30px;font-weight:400;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
input[type=text]{font:inherit;min-height:48px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:260px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.cardno{min-width:28px;height:28px;padding:0 6px;border-radius:8px;background:var(--ink);color:var(--bg);font-family:var(--display);font-size:16px;display:inline-grid;place-items:center}
.cardno.big{width:72px;height:72px;font-size:40px;border-radius:18px;justify-self:center}
.numpad-card{display:grid;gap:12px}
.numpad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.numpad button{min-height:56px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line);font-family:var(--display);font-size:24px}
.numpad button:hover{border-color:var(--accent)}
.back-card{display:grid;gap:16px;text-align:center;justify-items:center;padding-block:32px}
.back-coins{display:flex;gap:10px;justify-content:center}
.back-coins .coin{width:64px;height:64px;font-size:22px}
.who{display:grid;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.who h3{font-size:19px}
.chip.big{min-height:64px;padding:10px 26px;font-size:22px;font-family:var(--display)}
.chip.static{cursor:default;background:var(--surface)}
.calm-box{background:var(--warn-bg);border:2px solid var(--warn);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.calm-box b{font-family:var(--display);font-weight:400;font-size:21px}
.care{background:var(--warn-bg);border-radius:var(--r);padding:12px 16px;display:grid;gap:4px;font-size:15px}
.care>b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--warn)}
.care div{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.care svg{width:26px;height:26px}
.care time{color:var(--muted);font-variant-numeric:tabular-nums}
.vote-note{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface-2);border-radius:var(--r);padding:12px 16px}
.vote-note b{font-family:var(--display);font-weight:400;font-size:20px}
.vote-note p{font-size:15px;color:var(--muted)}

/* ===== 화사한 사탕 테마 ===== */
body{background-color:var(--bg);background-image:radial-gradient(var(--dot1) 2.5px,transparent 3px),radial-gradient(var(--dot2) 2.5px,transparent 3px),radial-gradient(var(--dot3) 2px,transparent 2.5px);background-size:46px 46px,46px 46px,46px 46px;background-position:0 0,23px 23px,11px 34px;font-size:18.5px}
h1{font-size:32px;letter-spacing:0}
.brand .mascot{width:62px;height:62px;flex:none;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
.brand h1 .hi{color:var(--accent)}
.brand small{font-size:14px}
.coins{border:0;box-shadow:0 4px 0 rgba(var(--shadow),.06),0 8px 20px rgba(var(--shadow),.08);padding:7px 16px 7px 8px}
.coin{background:radial-gradient(circle at 35% 30%,#fff3b8 0 18%,var(--sun) 19% 70%,#f2b62e 71%);color:#5a3d00;box-shadow:0 2px 0 #d99a1c}
.goal{height:12px;background:var(--surface-2)}
.goal i{background:repeating-linear-gradient(-45deg,var(--sun) 0 8px,#ffe08a 8px 16px);border-radius:6px}
.icon-btn{border:0;border-radius:16px;box-shadow:0 4px 0 rgba(var(--shadow),.06),0 8px 20px rgba(var(--shadow),.08)}
.tabs{gap:10px}
.tab{border:0;border-radius:24px;box-shadow:0 5px 0 rgba(var(--shadow),.07);background:var(--surface);min-height:76px;gap:4px;transition:transform .15s}
.tab:hover{transform:translateY(-2px)}
.tab svg{width:34px;height:34px;padding:6px;border-radius:50%;background:var(--tc-soft)}
.tab[data-tab="checkin"]{--tc:#ffcf4d;--tc-soft:#fff3c7;--tc-ink:#5a3d00}
.tab[data-tab="practice"]{--tc:#ff9fbf;--tc-soft:#ffe3ec;--tc-ink:#5a1530}
.tab[data-tab="aac"]{--tc:#7fd6bb;--tc-soft:#dcf6ee;--tc-ink:#0f4436}
.tab[data-tab="teacher"]{--tc:#c6a8ff;--tc-soft:#efe7ff;--tc-ink:#33186a}
.tab[aria-selected="true"]{background:var(--tc);color:var(--tc-ink);box-shadow:0 5px 0 rgba(var(--shadow),.14)}
.tab[aria-selected="true"] svg{background:rgba(255,255,255,.55)}
.card{border:0;border-radius:28px;padding:24px;box-shadow:0 6px 0 rgba(var(--shadow),.05),0 14px 32px rgba(var(--shadow),.07)}
.lead{font-size:16.5px}
.face-btn{border-radius:24px;background:var(--surface-2);border:3px solid transparent;transition:transform .15s}
.face-btn:hover{transform:translateY(-3px) rotate(-1.5deg)}
.face-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.04)}
.face-btn svg{filter:drop-shadow(0 3px 0 rgba(var(--shadow),.12))}
.thermo button{border:0;border-radius:16px;box-shadow:inset 0 -4px 0 rgba(var(--shadow),.06)}
.thermo button:nth-child(1){background:#d8f3e2}.thermo button:nth-child(2){background:#e9f5c9}.thermo button:nth-child(3){background:#fff1bf}.thermo button:nth-child(4){background:#ffdcbf}.thermo button:nth-child(5){background:#ffcfc8}
.thermo button{color:#3b2d4d}.thermo button small{color:#6d5c80}
.thermo button[aria-pressed="true"]{outline:4px solid var(--accent);outline-offset:2px;background-color:inherit;color:#3b2d4d}
.chip{border:2px solid var(--line);background:var(--surface)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn{border-radius:999px;box-shadow:0 5px 0 #b5336a;padding:10px 28px;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b5336a}
.btn.ghost{border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 rgba(var(--shadow),.08)}
.btn.sun{box-shadow:0 5px 0 #e0a816}
.day{border-radius:20px;background:var(--surface-2)}
.tag{border-radius:999px;padding:3px 10px}
.lv{border-radius:999px;padding:3px 10px}
.lv1{background:#d9f5e8;color:#1b6b48}.lv2{background:#dbeaff;color:#1f4f8c}.lv3{background:#ffe6d4;color:#9a4612}
.scen{border:0;border-radius:24px;box-shadow:0 5px 0 rgba(var(--shadow),.06),0 10px 24px rgba(var(--shadow),.06);transition:transform .15s}
.scen:hover{transform:translateY(-3px)}
.scen:nth-child(4n+1){background:linear-gradient(var(--surface),var(--surface)) padding-box;border-top:8px solid #ffcf4d}
.scen:nth-child(4n+2){border-top:8px solid #ff9fbf}
.scen:nth-child(4n+3){border-top:8px solid #7fd6bb}
.scen:nth-child(4n+4){border-top:8px solid #8ec5ff}
.cardno{border-radius:12px;background:var(--accent);color:var(--accent-ink)}
.numpad button{border:0;border-radius:18px;box-shadow:inset 0 -4px 0 rgba(var(--shadow),.07)}

.frame:nth-child(1) .pic{background:#fff6d9}.frame:nth-child(2) .pic{background:#ffeef4}.frame:nth-child(3) .pic{background:#e7f8f1}

.opt:nth-child(1) .k{background:#bfe0dc}.opt:nth-child(2) .k{background:#fde9a6}.opt:nth-child(3) .k{background:#f9d3e0}

.back-card::after{background:#9fe0c9;bottom:-60px;right:-40px}

/* 휴대폰: 표를 카드로, 번호 버튼은 5칸 */
@media (max-width:600px){
  .tbl-wrap{overflow:visible}

function onFeel(k){
  const P=S.play,s=P.s;
  if(s.who==='나'){ // 내 기분에는 정답이 없어요
    const same = k===s.feel || (s.feelAlt||[]).includes(k);
    P.step='say';P.showHint=false;render();
    toast(same?`맞아요, ${EMO[k].name}`:`${EMO[k].name}. 그렇게 느낄 수 있어요`);
    if(!same) setTimeout(()=>toast(`이럴 때 ${EMO[s.feel].name} 친구도 많아요`),2300);
    autoSpeak((same?'맞아요. ':'그렇게 느낄 수 있어요. ')+s.q); return;
  }
  const ok = k===s.feel || (s.feelAlt||[]).includes(k);
  if(ok){P.step='say';P.feelMsg=null;P.showHint=false;render();toast(`맞아요, ${EMO[k].name}`);autoSpeak(s.q);}
  else{ if(!P.feelTried.includes(k))P.feelTried.push(k); P.feelMsg=true; if(P.feelTried.length>=2)P.showHint=true; render(); autoSpeak('그럴 수도 있어요. 다시 보고 한 번 더 골라볼까요?'); }
}
function onOpt(i){
  const P=S.play,s=P.s,o=s.opts[i];
  P.tries++;
  if(o.ok){P.chosen=i;P.step='done';P.showHint=false;render();autoSpeak('잘했어요! '+s.model);}
  else{ if(!P.tried.includes(i))P.tried.push(i); P.sayMsg=i; P.wrong++; if(P.wrong>=2)P.showHint=true; render(); autoSpeak(o.fb); }
}
function onPlv(lv){
  const P=S.play;
  const solo=S.solo&&!P.fromCard?S.solo:0;
  if(lv==='auto') lv=(P.tries===1&&!P.help)?'ind':'part';
  S.log.push({t:'scen',id:P.s.id,tries:P.tries,help:P.help,lv,how:P.how||'',stu:curStu()||'',solo,ts:Date.now()});
  save();
  const n=1+(P.help?1:0);
  addCoin(1,solo?'도장을 받았어요!':'끝까지 해냈어요! 마음 코인 1개');
  if(solo){P.step='stamp';render();window.scrollTo({top:0});autoSpeak(`${P.s.no}번 카드 해냈어요!`);}
  else if(P.fromCard){P.step='back';P.earned=n;render();window.scrollTo({top:0});autoSpeak(`${P.s.no}번 카드 성공! 게임판으로 돌아가서 마음 코인 ${n}개를 받아요.`);}
  else{S.play=null; render();}
}

    ${care.length?`<div class="care"><b>마음 살피기</b>${care.map(r=>`<div><time>${fmt(r.ts)}</time><span>${esc(r.stu||'')}</span>${face(r.e)}<span>${EMO[r.e].name} · 온도 ${r.l}</span>${r.why&&r.why.length?`<span class="lead" style="font-size:14px">${esc(r.why.join(', '))}</span>`:''}${r.sample?'<span class="tag">예시</span>':''}</div>`).join('')}</div>`:''}
    <div class="solo-ctl"><div><b>혼자 연습 모드</b><p class="lead" style="font-size:14px">학생 태블릿에서 켜면 상황 연습 화면이 '오늘의 미션 카드 3장'으로 바뀌어요. 차시별 QR로도 켤 수 있어요.</p></div>
      <div class="chips">${[[0,'끄기'],[1,'1차시'],[2,'2차시'],[3,'3차시']].map(([v,t])=>`<button class="chip" data-solo="${v}" aria-pressed="${S.solo===v}">${t}</button>`).join('')}</div>
      ${S.solo?`<div class="solo-sum">${(S.students.length?S.students:['나']).map(n=>{const d=soloDone(S.solo,n),m=MISSIONS[S.solo];return `<span class="pill ${d.size>=m.cards.length?'p-ind':'p-none'}">${esc(n)} ${m.cards.filter(id=>d.has(id)).length}/${m.cards.length}</span>`}).join('')}</div>`:''}</div>
    <div class="row"><button class="chip" id="autoReadBtn" aria-pressed="${S.autoRead}">${S.autoRead?'자동 읽기 켜짐':'자동 읽기 꺼짐 (누를 때만 읽어요)'}</button><span class="lead" style="font-size:14px">글 읽기가 어려운 학생이 있으면 켜 주세요.</span></div>
    ${hasSample?'<p class="notice">지금 보이는 기록 중 일부는 화면 확인용 예시예요. 아래 버튼으로 지우고 실제 기록을 시작하세요.</p>':''}
    <div class="stat-row">
      <div class="stat"><b>${total}</b><span>연습한 상황</span></div>
      <div class="stat"><b>${total?Math.round(first/total*100):0}%</b><span>첫 시도에 바른 말 고르기</span></div>
      <div class="stat"><b>${help}</b><span>도움 카드 사용</span></div>
      <div class="stat"><b>${ind}</b><span>독립 수행 횟수</span></div>
    </div>
  </section>
  <section class="card" style="display:grid;gap:10px">
    <h3>소통 기술별 수행</h3>
    <div class="tbl-wrap"><table><thead><tr><th>기술</th><th>연습</th><th>첫 시도 성공률</th><th>도움 요청</th><th>최근 수행 수준</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="lead" style="font-size:14px">도움 요청 횟수는 감점이 아니에요. 스스로 도움을 청한 것도 소통 기술로 봅니다.</p>
  </section>
  <section class="card" style="display:grid;gap:10px">
    <h3>최근 활동</h3>
    <div class="log">${lastLog.map(r=>{const s=SCEN.find(x=>x.id===r.id);return `<div><time>${fmt(r.ts)}</time><b style="font-weight:500">${esc(r.stu||'')}</b><span>${s?s.title:r.id}</span><span class="pill ${lvTxt[r.lv][1]}">${lvTxt[r.lv][0]}</span><span class="lead" style="font-size:14px">시도 ${r.tries}회 · 도움 ${r.help}회${r.how?' · '+esc(r.how):''}${r.sample?' · 예시':''}</span></div>`}).join('')||'<p class="lead">아직 기록이 없어요. 상황 연습을 하나 마치면 여기에 쌓여요.</p>'}</div>
    <div class="row" id="resetRow"><button class="btn ghost" id="resetBtn" style="font-size:17px;min-height:48px">기록 모두 지우기</button></div>
  </section>`;
}

/* ---------- 렌더 & 이벤트 ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===S.tab));
  view.innerHTML = {checkin:vCheckin,practice:vPractice,aac:vAAC,teacher:vTeacher}[S.tab]();
  renderCoins();
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;S.tab=b.dataset.tab;if(S.tab!=='practice')S.play=null;render();window.scrollTo({top:0})});
$('#soundBtn').addEventListener('click',()=>{S.sound=!S.sound;try{speechSynthesis.cancel()}catch(e){}save();renderCoins();toast(S.sound?'소리를 켰어요':'소리를 껐어요')});
view.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.say!==undefined){speak(d.say);return}
  // 체크인
  if(d.ciE){S.ci.e=d.ciE;S.ci.l=null;render();autoSpeak(EMO[d.ciE].name);return}
  if(d.ciL){S.ci.l=+d.ciL;render();return}
  if(t.id==='ciMore'){S.ciMore=true;render();return}
  if(d.ciW){const w=S.ci.why,i=w.indexOf(d.ciW);i<0?w.push(d.ciW):w.splice(i,1);render();return}
  if(t.id==='ciSave'){if(!curStu())return;S.checks.push({e:S.ci.e,l:S.ci.l,why:S.ci.why.slice(),stu:curStu(),ts:Date.now()});const n=EMO[S.ci.e].name;S.ci={e:null,l:null,why:[]};save();addCoin(1,`기록했어요. 오늘 ${n}`);render();return}
  if(d.stu!==undefined){S.cur=d.stu;if(S.play&&S.play.step==='who'){S.play.step='story';render();autoSpeak(S.play.s.title+'. '+S.play.s.panels.map(p=>p[1]).join(' '));}else render();return}
  // 연습
  if(d.lv!==undefined){S.level=+d.lv;render();return}
  if(d.scen){startScen(d.scen,!!d.card);return}
  if(d.draw){const lv=+d.draw;const ever=new Set(S.log.filter(r=>r.t==='scen'&&!r.sample).map(r=>r.id));let pool=SCEN.filter(x=>x.lv===lv&&!ever.has(x.id));const all=!pool.length;if(all)pool=SCEN.filter(x=>x.lv===lv);const pick=pool[Math.floor(Math.random()*pool.length)];if(all)setTimeout(()=>toast(`${lv}단계 카드를 모두 해 봤어요! 다시 섞어서 뽑았어요`),2300);toast(`${pick.no}번 카드가 나왔어요`);startScen(pick.id,true);return}
  if(t.id==='backList'){S.play=null;clearHash();render();return}
  if(t.id==='toFeel'){S.play.step='feel';render();return}
  if(t.id==='helpBtn'){if(!S.play.help){S.play.showHint=true;S.play.help++;render();addCoin(1,'도움을 요청한 것도 멋진 소통이에요');autoSpeak(S.play.step==='feel'?S.play.s.feelHint:S.play.s.hint)}return}
  if(d.feel){onFeel(d.feel);return}
  if(d.opt!==undefined){onOpt(+d.opt);return}
  if(d.plv){onPlv(d.plv);return}
  if(t.id==='newGame'){S.coins=0;save();renderCoins();toast(`새 판을 시작해요. 목표 코인 ${goal()}개`);return}
  if(t.id==='countBtn'){speak('셋, 둘, 하나! 다 같이 들어요!');t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop');return}
  if(d.filter!==undefined){S.filter=d.filter;render();return}
  if(d.solo!==undefined){S.solo=+d.solo;S.showAll=false;save();render();toast(S.solo?`혼자 연습 모드: ${S.solo}차시 미션`:'혼자 연습 모드를 껐어요');return}
  if(t.id==='showAll'){S.showAll=true;render();return}
  if(t.id==='backMission'){S.showAll=false;render();return}
  if(d.how!==undefined){S.play.how=d.how;render();return}
  if(t.id==='autoReadBtn'){S.autoRead=!S.autoRead;save();render();toast(S.autoRead?'자동으로 읽어줘요':'누를 때만 읽어줘요');return}
  // AAC
  if(d.w){S.strip.push({w:d.w,c:d.c});speak(d.w);render();return}
  if(t.id==='aacSay'){speak(S.strip.map(x=>x.w).join(' '));return}
  if(t.id==='aacBack'){S.strip.pop();render();return}
  if(t.id==='aacClear'){S.strip=[];render();return}
  // 교사
  if(t.id==='resetBtn'){$('#resetRow').innerHTML='<span>정말 모든 기록과 코인을 지울까요?</span><button class="btn" id="resetYes" style="min-height:48px;font-size:17px">네, 지울게요</button><button class="btn ghost" id="resetNo" style="min-height:48px;font-size:17px">취소</button>';return}
  if(t.id==='resetYes'){S.log=[];S.checks=[];S.coins=0;S.filter='전체';save();render();toast('기록을 모두 지웠어요');return}
  if(t.id==='resetNo'){render();return}
});
view.addEventListener('change',e=>{if(e.target.id==='stuList'){S.students=e.target.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean).slice(0,MAXSTU);if(e.target.value.split(/[,，]/).filter(x=>x.trim()).length>MAXSTU)setTimeout(()=>toast('학생은 최대 7명까지 넣을 수 있어요'),2300);if(!S.students.includes(S.cur))S.cur=null;if(S.filter!=='전체'&&!S.students.includes(S.filter))S.filter='전체';save();render();toast('학생 명단을 저장했어요')}});
function clearHash(){try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
function fromHash(){const h=(location.hash||'').slice(1);
  const sm=/^solo([123])$/.exec(h);
  if(sm){S.solo=+sm[1];S.showAll=false;S.play=null;S.tab='practice';save();render();window.scrollTo({top:0});setTimeout(()=>toast(`${S.solo}차시 혼자 연습 미션을 시작해요`),300);return true}if(/^s\d{1,2}$/.test(h)&&SCEN.some(x=>x.id===h)){startScen(h,true);window.scrollTo({top:0});return true}return false}
window.addEventListener('hashchange',fromHash);
if(!fromHash()) render();
</script>
